name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install host tools and portlibs
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates curl bzip2 zip
          # The image already ships these; pkg.devkitpro.org refuses requests from CI runners.
          pkgs="ppc-freetype ppc-libpng ppc-libjpeg-turbo ppc-libwebp ppc-zlib ppc-bzip2 ppc-brotli wiiu-sdl2"
          dkp-pacman -Q $pkgs || dkp-pacman -Sy --noconfirm --needed $pkgs
      - name: Build mbedTLS and controller libraries
        run: ./scripts/build_portlibs.sh
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        run: make VERSION=${{ steps.version.outputs.version }} && make dist VERSION=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v5
        with:
          name: PictoChat-WiiU
          if-no-files-found: error
          path: |
            dist/PictoChat-WiiU.zip
            PictoChat.wuhb
            PictoChat.rpx
      - name: Move the latest tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f latest
          git push -f origin latest
      # Every push to main refreshes the "latest" release; tags like v1.2.0 also get their own release.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PictoChat for Wii U (latest)
          prerelease: false
          make_latest: true
          body: |
            Latest build of PictoChat for Wii U from ${{ github.sha }}.

            Extract PictoChat-WiiU.zip to the root of your SD card and open PictoChat from the Wii U Menu (requires Aroma).
          fail_on_unmatched_files: true
          files: |
            dist/PictoChat-WiiU.zip
            PictoChat.wuhb
            PictoChat.rpx
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/PictoChat-WiiU.zip
            PictoChat.wuhb
            PictoChat.rpx
