name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    defaults:
      run:
        working-directory: wii
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates
      - name: Install host tools and portlibs
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates curl bzip2 zip
          # The image already ships these; pkg.devkitpro.org refuses requests from CI runners.
          pkgs="ppc-freetype ppc-libpng ppc-libjpeg-turbo ppc-libwebp ppc-zlib ppc-bzip2 ppc-brotli"
          dkp-pacman -Q $pkgs || dkp-pacman -Sy --noconfirm --needed $pkgs
      - name: Build mbedTLS and controller libraries
        run: ./scripts/build_portlibs.sh
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        run: make VERSION=${{ steps.version.outputs.version }} && make dist VERSION=${{ steps.version.outputs.version }}
      - name: Collect
        run: mkdir -p ../out && cp dist/PictoChat-Wii.zip PictoChat.dol ../out/
      - uses: actions/upload-artifact@v5
        with:
          name: PictoChat-Wii
          if-no-files-found: error
          path: out/

  wiiu:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    defaults:
      run:
        working-directory: wiiu
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install host tools and portlibs
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates curl bzip2 zip
          # The image already ships these; pkg.devkitpro.org refuses requests from CI runners.
          pkgs="ppc-freetype ppc-libpng ppc-libjpeg-turbo ppc-libwebp ppc-zlib ppc-bzip2 ppc-brotli wiiu-sdl2"
          dkp-pacman -Q $pkgs || dkp-pacman -Sy --noconfirm --needed $pkgs
      - name: Build mbedTLS and controller libraries
        run: ./scripts/build_portlibs.sh
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        run: make VERSION=${{ steps.version.outputs.version }} && make dist VERSION=${{ steps.version.outputs.version }}
      - name: Collect
        run: mkdir -p ../out && cp dist/PictoChat-WUP.zip PictoChat.wuhb PictoChat.rpx ../out/
      - uses: actions/upload-artifact@v5
        with:
          name: PictoChat-WiiU
          if-no-files-found: error
          path: out/

  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    defaults:
      run:
        working-directory: switch
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install host tools and portlibs
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates curl bzip2 zip
          pkgs="switch-freetype switch-harfbuzz switch-libpng switch-libjpeg-turbo switch-libwebp switch-zlib switch-bzip2 switch-sdl2"
          dkp-pacman -Q $pkgs || dkp-pacman -Sy --noconfirm --needed $pkgs
      - name: Build mbedTLS
        run: ./scripts/build_portlibs.sh
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        run: make VERSION=${{ steps.version.outputs.version }} && make dist VERSION=${{ steps.version.outputs.version }}
      - name: Collect
        run: mkdir -p ../out && cp dist/PictoChat-Switch.zip PictoChat.nro ../out/
      - uses: actions/upload-artifact@v5
        with:
          name: PictoChat-Switch
          if-no-files-found: error
          path: out/

  n3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    defaults:
      run:
        working-directory: 3ds
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install host tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl bzip2 xz-utils zip
      - name: Build zlib, libpng, FreeType and mbedTLS
        run: ./scripts/build_portlibs.sh
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        run: make VERSION=${{ steps.version.outputs.version }} && make dist VERSION=${{ steps.version.outputs.version }}
      - name: Collect
        run: mkdir -p ../out && cp dist/PictoChat-3DS.zip PictoChat.3dsx ../out/
      - uses: actions/upload-artifact@v5
        with:
          name: PictoChat-3DS
          if-no-files-found: error
          path: out/
      - uses: actions/upload-artifact@v5
        with:
          name: build-3ds-elf
          if-no-files-found: error
          path: 3ds/PictoChat.elf

  # bannertool and makerom need a newer glibc than the devkitARM image has, so the CIA is packed on the runner.
  n3ds-cia:
    needs: n3ds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: build-3ds-elf
          path: 3ds
      - name: Install makerom and bannertool
        run: |
          mkdir -p "$HOME/bin" /tmp/mr /tmp/bt
          curl -sSLf -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          curl -sSLf -o /tmp/bannertool.tar.gz https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz
          unzip -oq /tmp/makerom.zip -d /tmp/mr && install -m755 "$(find /tmp/mr -type f -name makerom | head -1)" "$HOME/bin/makerom"
          tar -xzf /tmp/bannertool.tar.gz -C /tmp/bt && install -m755 "$(find /tmp/bt -type f -name bannertool | head -1)" "$HOME/bin/bannertool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat 3ds/VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build the CIA
        run: ./3ds/scripts/make_cia.sh ${{ steps.version.outputs.version }}
      - run: mkdir -p out && cp 3ds/PictoChat.cia out/PictoChat-3DS.cia
      - uses: actions/upload-artifact@v5
        with:
          name: PictoChat-3DS-cia
          if-no-files-found: error
          path: out/

  release:
    needs: [wii, wiiu, switch, n3ds, n3ds-cia]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          pattern: PictoChat-*
          merge-multiple: true
      # Tags like v1.2.0 get their own release, with notes from CHANGELOG.md.
      # GitHub marks the highest version as the Latest release.
      - name: Write the release notes
        run: |
          python3 .github/scripts/release_notes.py "${GITHUB_REF_NAME}" "${GITHUB_SHA}" > notes.md
      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          fail_on_unmatched_files: true
          body_path: notes.md
          files: |
            out/PictoChat-Wii.zip
            out/PictoChat.dol
            out/PictoChat-WUP.zip
            out/PictoChat.wuhb
            out/PictoChat.rpx
            out/PictoChat-Switch.zip
            out/PictoChat.nro
            out/PictoChat-3DS.zip
            out/PictoChat-3DS.cia
            out/PictoChat.3dsx
